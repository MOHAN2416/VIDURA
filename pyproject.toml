[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vidura"
version = "0.1.0"
description = "VIDURA: A permission-controlled, self-developing AI assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "VIDURA Team" }
]
dependencies = [
    "python-dotenv>=1.0.0",
    "ollama>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_testing_ros_pytest_entrypoint -p no:ament_lint -p no:ament_xmllint -p no:ament_pep257 -p no:ament_flake8 -p no:ament_copyright"
testpaths = ["tests"]

